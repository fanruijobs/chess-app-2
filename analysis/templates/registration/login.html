{% extends "analysis/base.html" %}

{% block title %}Log in · Chess Trainer{% endblock %}

{% block content %}
<h1>Log in</h1>
<form method="post">
  {% csrf_token %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <p>
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus autocomplete="username">
  </p>
  <p>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password">
  </p>
  <p><button type="submit">Log in</button></p>
</form>
{% if form.errors %}
  <p class="hint">That username and password didn't match. Please try again.</p>
{% endif %}
{% endblock %}
