{% extends "analysis/base.html" %}

{% block title %}Change password · Chess Trainer{% endblock %}

{% block content %}
<h1>Change password</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <p><button type="submit">Change password</button></p>
</form>
{% if form.errors %}
  <p class="hint">Please fix the errors above.</p>
{% endif %}
{% endblock %}
