# Public entry point for chess-app.
# Install to /etc/nginx/sites-available/chess-app and symlink into sites-enabled.
# gunicorn stays on 127.0.0.1:8000 and is never exposed directly.

server {
    listen 8888;
    listen [::]:8888;
    server_name 3.107.245.75;

    # Book scans / PDFs can be large uploads.
    client_max_body_size 64M;

    # collectstatic output — served straight off disk.
    location /static/ {
        alias /home/ubuntu/chess-app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Scanned page images. Empty on the current deploy (media/ was gitignored
    # and deliberately not copied), so these will 404 until it is populated.
    location /media/ {
        alias /home/ubuntu/chess-app/media/;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Engine analysis and book OCR are long-running requests.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
